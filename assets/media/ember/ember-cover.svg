<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="flame" x1="640" y1="470" x2="640" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c1121f"/>
      <stop offset=".55" stop-color="#e8590c"/>
      <stop offset="1" stop-color="#f0a202"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c1121f"/>
      <stop offset=".6" stop-color="#e8590c"/>
      <stop offset="1" stop-color="#f0a202"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="62%">
      <stop offset="0" stop-color="#e8590c" stop-opacity=".20"/>
      <stop offset="1" stop-color="#e8590c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="8%" r="42%">
      <stop offset="0" stop-color="#f0a202" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f0a202" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- warm paper background, same as the site -->
  <rect width="1280" height="720" fill="#fbf6f0"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- ember mark, same silhouette as the site logo -->
  <g transform="translate(150 196) scale(5.2)">
    <path fill="url(#flame)" d="M33.4 3.2c1.6 7.9-1.1 12.6-5 16.7-4.2 4.5-9.9 8.3-12.9 15.1-4.2 9.6.6 20.6 10.2 24.4-2.6-4.6-2.3-9.6.6-13.4 2.7-3.6 7-5.6 9.7-9.3 1.3 2.5 1 5.2-.2 7.8 4.4-2.9 6.6-7.9 6.3-12.8 3.4 3.3 4.8 8.3 3.8 13 5.5-4.4 8.1-11.4 7-18.4-1.4-9.1-8.4-16.7-19.5-23.1z"/>
    <path fill="#fff" fill-opacity=".22" d="M33.4 3.2c1.6 7.9-1.1 12.6-5 16.7-4.2 4.5-9.9 8.3-12.9 15.1-1.6 3.7-1.9 7.5-1.1 11 .3-2.6 1.1-5.2 2.4-7.7 3.2-6.2 8.6-9.8 12.6-14.1 3.3-3.5 5.6-7.6 4.9-13.6z"/>
  </g>

  <!-- wordmark -->
  <text x="500" y="330" font-size="128" font-weight="700" letter-spacing="-5" fill="url(#word)">Ember</text>
  <text x="506" y="392" font-size="35" font-weight="500" fill="#4a3b33">Media extraction for Python</text>

  <!-- chips -->
  <g font-size="24" font-weight="600" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
    <rect x="506" y="432" width="182" height="48" rx="24" fill="#fff" stroke="#d6c4b3"/>
    <text x="597" y="463" fill="#4a3b33" text-anchor="middle">18 services</text>

    <rect x="700" y="432" width="228" height="48" rx="24" fill="#fff" stroke="#d6c4b3"/>
    <text x="814" y="463" fill="#4a3b33" text-anchor="middle">1 dependency</text>

    <rect x="940" y="432" width="130" height="48" rx="24" fill="#fff" stroke="#d6c4b3"/>
    <text x="1005" y="463" fill="#4a3b33" text-anchor="middle">Python</text>
  </g>

  <!-- bottom hairline in ember gradient -->
  <rect x="0" y="712" width="1280" height="8" fill="url(#word)"/>
</svg>
