<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="rec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5623d"/>
      <stop offset="1" stop-color="#d84a26"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="8%" r="62%">
      <stop offset="0" stop-color="#f5623d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f5623d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="88%" cy="88%" r="44%">
      <stop offset="0" stop-color="#d84a26" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d84a26" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="page"><rect width="1280" height="720"/></clipPath>
  </defs>

  <g clip-path="url(#page)">
    <rect width="1280" height="720" fill="#0e0e10"/>
    <rect width="1280" height="720" fill="url(#warm)"/>
    <rect width="1280" height="720" fill="url(#warm2)"/>

    <!-- the capture frame: four corner brackets -->
    <g stroke="#f5623d" stroke-width="4" fill="none">
      <path d="M52 112V52h60"/>
      <path d="M1168 52h60v60"/>
      <path d="M52 608v60h60"/>
      <path d="M1228 608v60h-60"/>
    </g>

    <!-- app icon -->
    <g transform="translate(588 92)">
      <rect width="104" height="104" rx="28" fill="#26262c"/>
      <circle cx="52" cy="52" r="26" fill="url(#rec)"/>
    </g>

    <!-- wordmark -->
    <text x="640" y="304" text-anchor="middle" font-size="108" font-weight="800"
          letter-spacing="-5" fill="#f2f2f4">Clipr</text>
    <text x="640" y="352" text-anchor="middle" font-size="27" font-weight="500"
          letter-spacing="-0.3" fill="#8b8b95">Screen recording into a light, sharp GIF</text>

    <!-- the timeline: what you keep, between two markers -->
    <g transform="translate(250 404)">
      <rect width="780" height="132" rx="16" fill="#18181c" stroke="#26262c"/>

      <!-- frame strip -->
      <g transform="translate(28 26)">
        <rect width="724" height="54" rx="8" fill="#1d1d22"/>
        <g fill="#26262c">
          <rect x="8"   y="8" width="38" height="38" rx="4"/>
          <rect x="54"  y="8" width="38" height="38" rx="4"/>
          <rect x="100" y="8" width="38" height="38" rx="4"/>
          <rect x="146" y="8" width="38" height="38" rx="4"/>
          <rect x="192" y="8" width="38" height="38" rx="4"/>
          <rect x="238" y="8" width="38" height="38" rx="4"/>
          <rect x="284" y="8" width="38" height="38" rx="4"/>
          <rect x="330" y="8" width="38" height="38" rx="4"/>
          <rect x="376" y="8" width="38" height="38" rx="4"/>
          <rect x="422" y="8" width="38" height="38" rx="4"/>
          <rect x="468" y="8" width="38" height="38" rx="4"/>
          <rect x="514" y="8" width="38" height="38" rx="4"/>
          <rect x="560" y="8" width="38" height="38" rx="4"/>
          <rect x="606" y="8" width="38" height="38" rx="4"/>
          <rect x="652" y="8" width="38" height="38" rx="4"/>
        </g>
        <!-- the kept range -->
        <rect x="140" y="0" width="420" height="54" fill="#f5623d" fill-opacity=".16"/>
        <rect x="138" y="0" width="4" height="54" fill="#f5623d"/>
        <rect x="558" y="0" width="4" height="54" fill="#f5623d"/>
        <rect x="330" y="-6" width="2.4" height="66" fill="#ffffff"/>
      </g>

      <g font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#67676f">
        <text x="28" y="108">00:00</text>
        <text x="390" y="108" text-anchor="middle">kept 00:04 – 00:11 · 15 fps · 800 px · ≈ 1.4 MB</text>
        <text x="752" y="108" text-anchor="end">00:16</text>
      </g>
    </g>

    <!-- the floating panel -->
    <g transform="translate(455 572)">
      <rect width="370" height="54" rx="15" fill="#1c1c20" stroke="#34343c"/>
      <circle cx="30" cy="27" r="6" fill="#f5623d"/>
      <circle cx="30" cy="27" r="10" fill="#f5623d" fill-opacity=".18"/>
      <text x="52" y="33" font-family="ui-monospace, Consolas, monospace"
            font-size="15" font-weight="600" fill="#c6c6cd">00:12</text>

      <rect x="116" y="10" width="34" height="34" rx="9" fill="#f5623d"/>
      <rect x="126" y="20" width="14" height="14" rx="2" fill="#ffffff"/>

      <rect x="156" y="10" width="34" height="34" rx="9" fill="#26262c"/>
      <rect x="167" y="20" width="4" height="14" rx="1.5" fill="#c6c6cd"/>
      <rect x="175" y="20" width="4" height="14" rx="1.5" fill="#c6c6cd"/>

      <rect x="196" y="10" width="34" height="34" rx="9" fill="#26262c"/>
      <rect x="206.5" y="20.5" width="13" height="13" rx="2" fill="none" stroke="#c6c6cd" stroke-width="1.8" stroke-dasharray="3.4 2.6"/>

      <rect x="236" y="10" width="34" height="34" rx="9" fill="#26262c"/>
      <path d="M245 32v-11h5l2 2.6h9V32z" fill="none" stroke="#c6c6cd" stroke-width="1.8" stroke-linejoin="round"/>

      <rect x="276" y="10" width="34" height="34" rx="9" fill="#26262c"/>
      <circle cx="293" cy="27" r="4.6" fill="none" stroke="#c6c6cd" stroke-width="1.8"/>
      <circle cx="293" cy="27" r="8.4" fill="none" stroke="#c6c6cd" stroke-width="1.8" stroke-dasharray="2.6 3.4"/>

      <rect x="316" y="10" width="34" height="34" rx="9" fill="#26262c"/>
      <path d="M327 21l12 12M339 21l-12 12" stroke="#c6c6cd" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
